apiVersion: apps/v1
kind: Deployment
metadata:
  name: vintage-resume
  labels:
    app: vintage-resume
spec:
  replicas: 2
  selector:
    matchLabels:
      app: vintage-resume
  template:
    metadata:
      labels:
        app: vintage-resume
    spec:
      containers:
        - name: frontend
          image: vintage-resume:latest
          ports:
            - containerPort: 80
          resources:
            limits:
              cpu: 250m
              memory: 256Mi
